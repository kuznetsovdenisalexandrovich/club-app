<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Испытание 5 — перелистывание</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e8e3df;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}
  #bar{position:fixed;top:0;left:0;right:0;z-index:20;
    padding-top:max(env(safe-area-inset-top),0px);
    background:rgba(248,246,246,.94);border-bottom:1px solid rgba(0,0,0,.08)}
  #barin{display:flex;align-items:center;gap:10px;padding:8px 12px}
  #pos{font-size:12px;color:#666;white-space:nowrap}
  #ttl{font-size:12px;color:#111;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #win{position:fixed;left:0;right:0;bottom:0;overflow:hidden;background:#e8e3df}
  #f{border:0;display:block;transform-origin:top left;background:#f0f0f0;position:relative;z-index:2}

  /* Что видно ПОД страницей, когда её отодвигаешь пальцем */
  #under{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;padding:0 30px;text-align:center}
  #under .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8d857d}
  #under .t{font-size:19px;line-height:1.3;color:#191512}

  /* Загнутый уголок: тень под страницей + сам отгиб */
  #curl{position:absolute;right:0;bottom:0;z-index:3;width:64px;height:64px;
    pointer-events:none;transition:width .3s ease,height .3s ease,opacity .3s ease;opacity:.5}
  #curl.big{width:104px;height:104px;opacity:1}
  #curl .fold{position:absolute;inset:0;
    background:linear-gradient(225deg,#fbf9f8 0%,#efe9e4 46%,#cfc6be 62%,#a89e95 100%);
    clip-path:polygon(100% 0,100% 100%,0 100%);
    border-top-left-radius:10px;
    box-shadow:-6px -6px 16px rgba(0,0,0,.16)}
  #curl .hint{position:absolute;right:7px;bottom:5px;font-size:9.5px;color:#6b625a;
    letter-spacing:.04em;transform:rotate(-45deg);transform-origin:100% 100%;white-space:nowrap}

  #tip{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;
    text-align:center;font-size:11.5px;color:#fff;pointer-events:none;
    transition:opacity .5s ease}
  #tip span{background:rgba(20,17,15,.82);padding:7px 14px;border-radius:20px}
  #tip.gone{opacity:0}
</style>
</head>
<body>

<div id="bar"><div id="barin">
  <span id="pos">—</span><span id="ttl"></span>
</div></div>

<div id="win">
  <div id="under"><div class="k" id="under-k">Дальше</div><div class="t" id="under-t"></div></div>
  <iframe id="f" src="about:blank" scrolling="yes"></iframe>
  <div id="curl"><div class="fold"></div><div class="hint">листать</div></div>
</div>

<div id="tip"><span>Листай вбок, как страницу журнала</span></div>

<script>
/* Перелистывание вместо кнопок.

   Страница журнала листается вбок — свайпом в любом месте экрана. Палец ведёт
   страницу за собой, под ней проступает, что будет дальше. Внизу справа загнут
   уголок: он подсказывает, что страница листается, и становится заметнее, когда
   часть дочитана до конца.

   Плюс сохранено дотягивание вверх у самого низа — теперь оно ловит и то
   движение, которым человек только что доехал до конца (в прошлый раз я
   проверял «мы у низа» в момент касания, а до низа доезжали этим же жестом). */

const CANVAS = 1280;
let parts = [], idx = 0, busy = false, atBottom = false, preloaded = -1;

async function boot(){
  try {
    const d = await fetch('pilot/parts.json?v=' + Date.now()).then(r => r.json());
    parts = d.parts || [];
  } catch(e){}
  if (!parts.length){ document.getElementById('pos').textContent = 'нет частей'; return; }
  open_(0);
  setTimeout(function(){ document.getElementById('tip').classList.add('gone'); }, 4200);
}

function baseScale(){ return document.getElementById('win').clientWidth / CANVAS; }
function baseTransform(){ return 'scale(' + baseScale() + ')'; }
function fitWindow(){
  document.getElementById('win').style.top = document.getElementById('bar').offsetHeight + 'px';
}

function open_(i, dir){
  if (busy) return;
  const target = Math.max(0, Math.min(parts.length - 1, i));
  if (target === idx && dir) return;
  busy = true;
  idx = target; atBottom = false; preloaded = -1;

  document.getElementById('pos').textContent = (idx + 1) + '/' + parts.length;
  document.getElementById('ttl').textContent = parts[idx].title;
  document.getElementById('curl').classList.remove('big');
  updateUnder(dir === -1 ? -1 : 1);

  const f = document.getElementById('f');
  f.onload = onLoaded;
  f.src = 'pilot/' + parts[idx].file;
}

function updateUnder(dir){
  const j = idx + (dir === -1 ? -1 : 1);
  const has = j >= 0 && j < parts.length;
  document.getElementById('under-k').textContent = has ? (dir === -1 ? 'Назад' : 'Дальше') : '';
  document.getElementById('under-t').textContent = has ? parts[j].title : 'Это последняя часть';
}

function turn(dir){
  const j = idx + dir;
  if (j < 0 || j >= parts.length) return false;
  open_(j, dir);
  return true;
}

function onLoaded(){
  busy = false;
  fitWindow();
  const f = document.getElementById('f');
  const win = document.getElementById('win');
  const scale = baseScale();

  f.style.transition = '';
  f.style.width = CANVAS + 'px';
  f.style.height = Math.ceil(win.clientHeight / scale) + 'px';
  f.style.transform = baseTransform();

  let d;
  try { d = f.contentDocument; } catch(e){ return; }
  const dw = d.defaultView;

  const st = d.createElement('style');
  // Внутри выпуска есть элемент шире холста — из-за него сбоку лезла полоса фона
  st.textContent = 'html,body{overflow-x:hidden!important}';
  d.head.appendChild(st);
  dw.scrollTo(0, 0);

  dw.addEventListener('scroll', function(){
    const total = d.body.scrollHeight;
    const seen = dw.scrollY + dw.innerHeight;
    if (seen > total * 0.75 && preloaded !== idx && idx + 1 < parts.length){
      preloaded = idx;
      fetch('pilot/' + parts[idx + 1].file).catch(function(){});
    }
    atBottom = seen >= total - 60;
    document.getElementById('curl').classList.toggle('big', atBottom && idx + 1 < parts.length);
  }, { passive: true });

  wireGestures(d, dw);
}

function wireGestures(d, dw){
  const f = document.getElementById('f');
  let x0 = 0, y0 = 0, dx = 0, pull = 0;
  let axis = null;          // 'x' — листаем вбок, 'y' — дотягиваем вверх, null — ещё не решили
  let pulling = false;

  function reset(animate){
    f.style.transition = animate ? 'transform .26s ease' : '';
    f.style.transform = baseTransform();
    if (animate) setTimeout(function(){ f.style.transition = ''; }, 280);
  }

  d.addEventListener('touchstart', function(e){
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    dx = 0; pull = 0; axis = null; pulling = false;
    f.style.transition = '';
  }, { passive: true });

  d.addEventListener('touchmove', function(e){
    const t = e.touches[0];
    const mx = t.clientX - x0, my = t.clientY - y0;

    if (!axis){
      if (Math.abs(mx) > 14 && Math.abs(mx) > Math.abs(my) * 1.3) axis = 'x';
      else if (Math.abs(my) > 14) axis = 'y';
    }

    if (axis === 'x'){
      e.preventDefault();                       // держим страницу, не даём ей скроллиться
      dx = mx;
      const j = idx + (dx < 0 ? 1 : -1);
      if (j < 0 || j >= parts.length) dx = mx / 4;   // упругое сопротивление на краях
      updateUnder(dx < 0 ? 1 : -1);
      f.style.transform = 'translateX(' + dx + 'px) ' + baseTransform();
      return;
    }

    // Дотягивание вверх у самого низа. Порог берём от ТЕКУЩЕЙ точки, а не от
    // начала касания — иначе жест, которым доехали до низа, не засчитывается
    if (atBottom && my < 0 && idx + 1 < parts.length){
      if (!pulling){ pulling = true; y0 = t.clientY; }
      pull = Math.min(140, (y0 - t.clientY) * 0.55);
      updateUnder(1);
      f.style.transform = 'translateY(' + (-pull) + 'px) ' + baseTransform();
    } else if (pulling){
      pulling = false; pull = 0; reset(false);
    }
  }, { passive: false });

  d.addEventListener('touchend', function(){
    const w = document.getElementById('win').clientWidth;
    if (axis === 'x' && Math.abs(dx) > w * 0.22){
      const dir = dx < 0 ? 1 : -1;
      f.style.transition = 'transform .2s ease';
      f.style.transform = 'translateX(' + (dir === 1 ? -w : w) + 'px) ' + baseTransform();
      setTimeout(function(){ if (!turn(dir)) reset(true); }, 190);
    } else if (pulling && pull > 70){
      if (!turn(1)) reset(true);
    } else {
      reset(true);
    }
    axis = null; dx = 0; pull = 0; pulling = false;
  }, { passive: true });
}

document.getElementById('curl').addEventListener('click', function(){ turn(1); });
window.addEventListener('resize', fitWindow);
boot();
</script>
</body>
</html>
