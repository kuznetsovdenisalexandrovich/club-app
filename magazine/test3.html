<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Испытание 3 — по частям</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f0f0f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;
    padding-top:max(env(safe-area-inset-top),0px);
    background:rgba(248,246,246,.94);border-bottom:1px solid rgba(0,0,0,.08)}
  #barin{display:flex;align-items:center;gap:8px;padding:8px 10px}
  button{appearance:none;-webkit-appearance:none;border:1px solid #ccc;background:#fff;
    border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:disabled{opacity:.35}
  #pos{font-size:12px;color:#555;flex:1;text-align:center}
  #win{position:fixed;left:0;right:0;overflow:hidden;bottom:0}
  #f{border:0;display:block;transform-origin:top left;background:#f0f0f0}
  #next-wrap{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(240,240,240,0),rgba(240,240,240,.96) 40%);
    display:none}
  #next-wrap.show{display:block}
  #next{width:100%;background:#111;color:#fff;border-color:#111;padding:13px}
</style>
</head>
<body>

<div id="bar"><div id="barin">
  <button id="prev" onclick="go(-1)">←</button>
  <span id="pos">—</span>
  <button id="fwd" onclick="go(1)">→</button>
</div></div>

<div id="win"><iframe id="f" src="about:blank" scrolling="yes"></iframe></div>
<div id="next-wrap"><button id="next" onclick="go(1)">Читать дальше</button></div>

<script>
/* Тот же самый способ вписывания, что стоит в аппе (iframe шириной 1280 +
   transform). Отличие ровно одно: выпуск разрезан на части по главам, и за раз
   в память попадает одна часть, а не все 65 тысяч пикселей сразу. */

const CANVAS = 1280;
let parts = [], idx = 0;

async function boot(){
  try {
    const d = await fetch('pilot/parts.json?v=' + Date.now()).then(r => r.json());
    parts = d.parts || [];
  } catch(e){ parts = []; }
  if (!parts.length){ document.getElementById('pos').textContent = 'нет частей'; return; }
  open_(0);
}

function open_(i){
  idx = Math.max(0, Math.min(parts.length - 1, i));
  document.getElementById('pos').textContent = 'часть ' + (idx + 1) + ' из ' + parts.length;
  document.getElementById('prev').disabled = (idx === 0);
  document.getElementById('fwd').disabled  = (idx === parts.length - 1);
  document.getElementById('next-wrap').classList.remove('show');

  const f = document.getElementById('f');
  f.onload = onLoaded;
  f.src = 'about:blank';
  setTimeout(function(){ f.src = 'pilot/' + parts[idx] + '?v=' + Date.now(); }, 60);
}

function go(step){ open_(idx + step); }

function fitWindow(){
  document.getElementById('win').style.top = document.getElementById('bar').offsetHeight + 'px';
}

function onLoaded(){
  fitWindow();
  const f = document.getElementById('f');
  const win = document.getElementById('win');
  const w = win.clientWidth, h = win.clientHeight;
  const scale = w / CANVAS;

  f.style.width = CANVAS + 'px';
  f.style.height = Math.ceil(h / scale) + 'px';
  f.style.transform = 'scale(' + scale + ')';

  try {
    const d = f.contentDocument;
    const st = d.createElement('style');
    // Внутри выпуска есть элемент шире холста — из-за него сбоку лезла полоса фона
    st.textContent = 'html,body{overflow-x:hidden!important}';
    d.head.appendChild(st);
    d.defaultView.scrollTo(0, 0);

    // Кнопка «дальше» выезжает, когда дочитал часть до конца
    d.defaultView.addEventListener('scroll', function(){
      const win2 = d.defaultView;
      const bottom = win2.scrollY + win2.innerHeight >= d.body.scrollHeight - 80;
      document.getElementById('next-wrap').classList.toggle('show',
        bottom && idx < parts.length - 1);
    }, { passive: true });
  } catch(e){}
}

window.addEventListener('resize', fitWindow);
boot();
</script>
</body>
</html>
