<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал — чтение</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e8e3df;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}

  #bar{position:fixed;top:0;left:0;right:0;z-index:20;
    padding-top:max(env(safe-area-inset-top),0px);
    background:rgba(248,246,246,.94);border-bottom:1px solid rgba(0,0,0,.08)}
  #barin{display:flex;align-items:center;gap:10px;padding:8px 12px}
  #pos{font-size:12px;color:#666;white-space:nowrap}
  #ttl{font-size:12px;color:#111;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #win{position:fixed;left:0;right:0;bottom:0;overflow:hidden;background:#e8e3df}
  #f{border:0;display:block;transform-origin:top left;background:#f0f0f0;position:relative;z-index:1}

  .side{position:absolute;top:0;bottom:0;width:54px;z-index:4;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .3s ease;-webkit-tap-highlight-color:transparent}
  .side.next{right:0;background:linear-gradient(270deg,rgba(255,252,250,.72),rgba(255,252,250,.28) 60%,rgba(255,252,250,0))}
  .side.prev{left:0;background:linear-gradient(90deg,rgba(255,252,250,.62),rgba(255,252,250,.22) 60%,rgba(255,252,250,0))}
  .side.hidden{opacity:0;pointer-events:none}
  .side .knob{width:34px;height:34px;border-radius:50%;
    background:rgba(255,253,251,.9);border:1px solid rgba(24,20,17,.14);
    box-shadow:0 3px 12px rgba(24,20,17,.14);
    display:flex;align-items:center;justify-content:center;
    color:#1c1815;font-size:17px;line-height:1;
    transition:transform .3s ease,background .25s ease}
  .side .cap{position:absolute;bottom:14%;writing-mode:vertical-rl;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:#6d645c;opacity:.85}
  .side.prev .cap{transform:rotate(180deg)}
  .side.ready .knob{transform:scale(1.18);background:#1c1815;color:#fff;border-color:#1c1815}
  .side:active .knob{transform:scale(.92)}
</style>
</head>
<body>

<div id="bar"><div id="barin">
  <span id="pos">—</span><span id="ttl"></span>
</div></div>

<div id="win">
  <iframe id="f" src="about:blank" scrolling="yes"></iframe>
  <div class="side prev hidden" id="side-prev"><span class="knob">‹</span><span class="cap">Назад</span></div>
  <div class="side next hidden" id="side-next"><span class="knob">›</span><span class="cap">Дальше</span></div>
</div>

<script>
/* Чтение выпуска по частям.

   Механика намеренно вернулась к самой первой рабочей версии — той, что прошла
   весь выпуск без падений. С тех пор я добавлял «улучшения», и каждое из них
   подъедало память:

   • пересоздание iframe — выброшенный узел ждёт уборки мусора, тогда как при
     смене адреса браузер сносит прежний документ немедленно и обязательно;
   • предзагрузка следующей части через fetch — лишняя копия документа в памяти;
   • всплывающая подсказка с названием — лишние узлы и слушатели.

   Здесь всего этого нет. Один и тот же iframe, смена адреса через пустую
   страницу, ни одного обработчика касаний внутри выпуска (любой из них убивает
   инерцию прокрутки, потому что браузер вынужден спрашивать наш код перед
   каждым кадром). */

const CANVAS = 1280;
let parts = [], idx = 0, busy = false;

async function boot(){
  try {
    const d = await fetch('pilot/parts.json?v=' + Date.now()).then(r => r.json());
    parts = d.parts || [];
  } catch(e){}
  if (!parts.length){ document.getElementById('pos').textContent = 'нет частей'; return; }
  open_(0);
}

function baseScale(){ return document.getElementById('win').clientWidth / CANVAS; }
function fitWindow(){
  document.getElementById('win').style.top = document.getElementById('bar').offsetHeight + 'px';
}

function open_(i){
  if (busy) return;
  busy = true;
  idx = Math.max(0, Math.min(parts.length - 1, i));

  document.getElementById('pos').textContent = (idx + 1) + '/' + parts.length;
  document.getElementById('ttl').textContent = parts[idx].title;
  document.getElementById('side-prev').classList.toggle('hidden', idx === 0);
  document.getElementById('side-next').classList.toggle('hidden', idx >= parts.length - 1);
  document.getElementById('side-next').classList.remove('ready');

  const f = document.getElementById('f');
  f.onload = onLoaded;
  f.src = 'about:blank';
  setTimeout(function(){ f.src = 'pilot/' + parts[idx].file; }, 60);
}

function turn(step){ open_(idx + step); }

function onLoaded(){
  const f = document.getElementById('f');
  if (!f || !f.src || f.src.indexOf('about:blank') !== -1) return;
  busy = false;
  fitWindow();

  const win = document.getElementById('win');
  const scale = baseScale();
  f.style.width = CANVAS + 'px';
  f.style.height = Math.ceil(win.clientHeight / scale) + 'px';
  f.style.transform = 'scale(' + scale + ')';

  let d;
  try { d = f.contentDocument; } catch(e){ return; }
  const dw = d.defaultView;

  const st = d.createElement('style');
  // Внутри выпуска есть элемент шире холста — из-за него сбоку лезла полоса фона
  st.textContent = 'html,body{overflow-x:hidden!important}';
  d.head.appendChild(st);
  dw.scrollTo(0, 0);

  dw.addEventListener('scroll', function(){
    const seen = dw.scrollY + dw.innerHeight;
    document.getElementById('side-next').classList
      .toggle('ready', seen >= d.body.scrollHeight - 60);
  }, { passive: true });
}

document.getElementById('side-next').addEventListener('click', function(){ turn(1); });
document.getElementById('side-prev').addEventListener('click', function(){ turn(-1); });
window.addEventListener('resize', fitWindow);
boot();
</script>
</body>
</html>
