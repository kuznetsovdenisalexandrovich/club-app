<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал — чтение</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f7f2f1;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}
  #bar{position:fixed;top:0;left:0;right:0;z-index:20;
    padding-top:max(env(safe-area-inset-top),0px);
    background:rgba(250,247,246,.94);border-bottom:1px solid rgba(0,0,0,.07)}
  #barin{display:flex;align-items:center;gap:10px;padding:9px 13px}
  #barin button{flex:1;appearance:none;-webkit-appearance:none;border:1px solid #d5cdc9;
    background:#fff;border-radius:9px;padding:8px 6px;font:inherit;font-size:12px;cursor:pointer}
  #barin button.on{background:#1c1815;color:#fff;border-color:#1c1815}
  #win{position:fixed;left:0;right:0;bottom:0;overflow:hidden;background:#f7f2f1}
  #f{border:0;display:block;transform-origin:top left;background:#fff}
  #splash{position:absolute;inset:0;z-index:3;display:flex;align-items:center;
    justify-content:center;font-size:12.5px;color:#8d857d;background:#f7f2f1;
    transition:opacity .35s ease}
  #splash.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div id="bar"><div id="barin">
  <button id="mA" onclick="setMethod('transform')">Сжатие после</button>
  <button id="mB" onclick="setMethod('zoom')">Уменьшение до</button>
</div></div>
<div id="win">
  <div id="splash">Открываем выпуск…</div>
  <iframe id="f" src="pilot/index.html" scrolling="yes"></iframe>
</div>

<script>
/* Выпуск целиком, без нарезки на части.

   Резать пришлось из-за падений, но виноват был не размер документа как таковой,
   а фон, приколоченный к экрану: внутри уменьшенной страницы его нельзя
   перерисовать дёшево — браузер перекрашивает всё окно на каждом кадре
   прокрутки. Убрали его — и целый выпуск держится.

   Здесь у длинных блоков фотофон заменён градиентом. Градиент рисуется
   практически бесплатно: это не картинка, которую надо разжимать и хранить
   в памяти, а формула цвета.

   Обложка оставлена нетронутой — она короткая, и вся заявка выпуска в ней. */

const CANVAS = 1280;

// Блоки, у которых фон меняется на градиент: 7097px и 14675px высотой.
// Именно они и роняли страницу
const GRADIENT_BLOCKS = ['rec740993783', 'rec741003030'];
const GRADIENT = 'linear-gradient(180deg,#ffffff 0%,#fdf6f7 38%,#fbe9ee 72%,#f9dfe6 100%)';

function fitWindow(){
  document.getElementById('win').style.top =
    document.getElementById('bar').offsetHeight + 'px';
}

let method = 'transform';

function setMethod(m){
  method = m;
  document.getElementById('mA').className = (m === 'transform' ? 'on' : '');
  document.getElementById('mB').className = (m === 'zoom' ? 'on' : '');
  document.getElementById('splash').classList.remove('hidden');
  const f = document.getElementById('f');
  f.style.transform = 'none';
  f.style.zoom = '';
  f.src = 'about:blank';
  setTimeout(function(){ f.src = 'pilot/index.html?v=' + Date.now(); }, 80);
}

function fit(){
  fitWindow();
  const win = document.getElementById('win');
  const f = document.getElementById('f');
  const w = win.clientWidth, h = win.clientHeight;
  if (!w || !h) return;
  const scale = w / CANVAS;
  f.style.width = CANVAS + 'px';
  f.style.height = Math.ceil(h / scale) + 'px';

  if (method === 'zoom'){
    // Просим браузер уменьшить страницу ДО отрисовки: он рисует её сразу
    // в разрешении экрана, как делает с обычной вкладкой. Куски картинки
    // в памяти получаются шириной с телефон, а не с холст
    f.style.transform = 'none';
    f.style.zoom = scale;
  } else {
    // Рисуем в полный размер и сжимаем готовое — так было до сих пор
    f.style.zoom = '';
    f.style.transform = 'scale(' + scale + ')';
  }
}

document.getElementById('f').addEventListener('load', function(){
  fit();
  const f = document.getElementById('f');
  let d;
  try { d = f.contentDocument; } catch(e){ return; }

  const st = d.createElement('style');
  st.textContent =
    // Внутри выпуска есть элемент шире холста — из-за него сбоку лезла полоса фона
    'html,body{overflow-x:hidden!important}'
    // Снимаем замирание: фоны едут вместе со страницей
    + '.t396__carrier{position:absolute!important;background-attachment:scroll!important;'
    + 'height:100%!important;top:0!important;transform:none!important}'
    + '.t674__cover,.t674__cover_fixed{position:absolute!important}'
    // Длинным блокам — градиент вместо фотографии
    + GRADIENT_BLOCKS.map(function(id){
        return '#' + id + ' .t396__carrier{background-image:' + GRADIENT + '!important}';
      }).join('');
  d.head.appendChild(st);

  setTimeout(function(){ document.getElementById('splash').classList.add('hidden'); }, 200);
});

window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
setTimeout(fit, 300);
setTimeout(fit, 1200);
setMethod('transform');
</script>
</body>
</html>
