<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал — чтение</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e8e3df;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}

  #bar{position:fixed;top:0;left:0;right:0;z-index:20;
    padding-top:max(env(safe-area-inset-top),0px);
    background:rgba(248,246,246,.94);border-bottom:1px solid rgba(0,0,0,.08)}
  #barin{display:flex;align-items:center;gap:10px;padding:8px 12px}
  #pos{font-size:12px;color:#666;white-space:nowrap}
  #ttl{font-size:12px;color:#111;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #win{position:fixed;left:0;right:0;bottom:0;overflow:hidden;background:#e8e3df}
  #f{border:0;display:block;transform-origin:top left;background:#f0f0f0;position:relative;z-index:1}

  /* Боковые полосы — единственный способ перейти к соседней части.
     Внутри страницы выпуска никаких обработчиков касаний нет вовсе, поэтому
     прокрутка остаётся полностью на стороне браузера, с обычной инерцией. */
  .side{position:absolute;top:0;bottom:0;width:54px;z-index:4;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .3s ease;-webkit-tap-highlight-color:transparent}
  .side.next{right:0;background:linear-gradient(270deg,rgba(255,252,250,.72),rgba(255,252,250,.28) 60%,rgba(255,252,250,0))}
  .side.prev{left:0;background:linear-gradient(90deg,rgba(255,252,250,.62),rgba(255,252,250,.22) 60%,rgba(255,252,250,0))}
  .side.hidden{opacity:0;pointer-events:none}

  /* Кнопка-кругляш вместо сплошной накладки: занимает меньше места и не спорит
     с оформлением выпуска */
  .side .knob{width:34px;height:34px;border-radius:50%;
    background:rgba(255,253,251,.9);border:1px solid rgba(24,20,17,.14);
    box-shadow:0 3px 12px rgba(24,20,17,.14);
    display:flex;align-items:center;justify-content:center;
    color:#1c1815;font-size:17px;line-height:1;
    transition:transform .3s ease,background .25s ease}
  .side .cap{position:absolute;bottom:14%;writing-mode:vertical-rl;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:#6d645c;opacity:.85}
  .side.prev .cap{transform:rotate(180deg)}
  .side.ready .knob{transform:scale(1.18);background:#1c1815;color:#fff;border-color:#1c1815}
  .side:active .knob{transform:scale(.92)}

  #peek{position:absolute;z-index:5;right:52px;top:50%;transform:translateY(-50%);
    max-width:58%;padding:9px 13px;border-radius:12px;background:rgba(28,24,21,.88);
    color:#fff;font-size:12.5px;line-height:1.35;opacity:0;pointer-events:none;
    transition:opacity .2s ease}
  #peek.show{opacity:1}
  #peek.left{left:52px;right:auto}
</style>
</head>
<body>

<div id="bar"><div id="barin">
  <span id="pos">—</span><span id="ttl"></span>
</div></div>

<div id="win">
  <div class="side prev hidden" id="side-prev"><span class="knob">‹</span><span class="cap">Назад</span></div>
  <div class="side next hidden" id="side-next"><span class="knob">›</span><span class="cap">Дальше</span></div>
  <div id="peek"></div>
</div>

<script>
/* Чтение выпуска по частям.

   Выпуск свёрстан в Тильде под жёсткий холст 1280px, поэтому страница живёт
   в iframe этой ширины и уменьшается через transform — так же, как это делает
   мобильный браузер со всей страницей.

   Целиком выпуск (~65000px) телефон не тянет: браузеру приходится держать
   слой во всю высоту документа, и вебвью падает по памяти. Поэтому выпуск
   разрезан на части по границам глав, и в памяти живёт ровно одна.

   Переход между частями — только по боковым полосам. Жесты внутри страницы
   не ловим принципиально: любой обработчик касаний там убивает инерцию
   прокрутки, потому что браузер вынужден спрашивать наш код перед каждым
   кадром. */

const CANVAS = 1280;
let parts = [], idx = 0, busy = false, preloaded = -1;

async function boot(){
  try {
    const d = await fetch('pilot/parts.json?v=' + Date.now()).then(r => r.json());
    parts = d.parts || [];
  } catch(e){}
  if (!parts.length){ document.getElementById('pos').textContent = 'нет частей'; return; }
  open_(0);
}

function baseScale(){ return document.getElementById('win').clientWidth / CANVAS; }
function fitWindow(){
  document.getElementById('win').style.top = document.getElementById('bar').offsetHeight + 'px';
}

function open_(i){
  if (busy) return;
  const target = Math.max(0, Math.min(parts.length - 1, i));
  busy = true;
  idx = target; preloaded = -1;

  document.getElementById('pos').textContent = (idx + 1) + '/' + parts.length;
  document.getElementById('ttl').textContent = parts[idx].title;
  document.getElementById('side-prev').classList.toggle('hidden', idx === 0);
  document.getElementById('side-next').classList.toggle('hidden', idx >= parts.length - 1);
  document.getElementById('side-next').classList.remove('ready');
  document.getElementById('peek').classList.remove('show');

  // ВАЖНО ПРО ПАМЯТЬ: старое окно не переиспользуем, а выбрасываем целиком и
  // создаём новое. Подмена адреса оставляла предыдущую часть в памяти в момент
  // загрузки следующей, и на тяжёлых частях вебвью падал. Снос узла из дерева
  // освобождает её надёжнее, а пауза даёт браузеру время это сделать
  const win = document.getElementById('win');
  const oldFrame = document.getElementById('f');
  if (oldFrame){
    oldFrame.onload = null;
    oldFrame.src = 'about:blank';
    oldFrame.remove();
  }

  setTimeout(function(){
    const f = document.createElement('iframe');
    f.id = 'f';
    f.setAttribute('scrolling', 'yes');
    f.style.visibility = 'hidden';   // иначе на месте старой части мигает пустой лист
    f.onload = onLoaded;
    win.insertBefore(f, win.firstChild);
    f.src = 'pilot/' + parts[idx].file;
  }, 220);
}

function turn(step){ open_(idx + step); }

function onLoaded(){
  busy = false;
  fitWindow();
  const f = document.getElementById('f');
  if (!f) return;
  const win = document.getElementById('win');
  const scale = baseScale();

  f.style.width = CANVAS + 'px';
  f.style.height = Math.ceil(win.clientHeight / scale) + 'px';
  f.style.transform = 'scale(' + scale + ')';
  f.style.visibility = 'visible';

  let d;
  try { d = f.contentDocument; } catch(e){ return; }
  const dw = d.defaultView;

  const st = d.createElement('style');
  // Внутри выпуска есть элемент шире холста — из-за него сбоку лезла полоса фона
  st.textContent = 'html,body{overflow-x:hidden!important}';
  d.head.appendChild(st);
  dw.scrollTo(0, 0);

  // Единственный обработчик внутри страницы — пассивный, ничего не отменяет
  dw.addEventListener('scroll', function(){
    const total = d.body.scrollHeight;
    const seen = dw.scrollY + dw.innerHeight;

    if (seen > total * 0.75 && preloaded !== idx && idx + 1 < parts.length){
      preloaded = idx;
      fetch('pilot/' + parts[idx + 1].file).catch(function(){});
    }
    // Дочитал часть — полоса становится заметнее
    document.getElementById('side-next').classList.toggle('ready', seen >= total - 60);
  }, { passive: true });
}

function wireSide(el, step){
  const peek = document.getElementById('peek');
  function showPeek(){
    const j = idx + step;
    if (j < 0 || j >= parts.length) return;
    peek.textContent = parts[j].title;
    peek.classList.toggle('left', step < 0);
    peek.classList.add('show');
  }
  function hidePeek(){ peek.classList.remove('show'); }

  el.addEventListener('touchstart', showPeek, { passive: true });
  el.addEventListener('touchend', hidePeek, { passive: true });
  el.addEventListener('touchcancel', hidePeek, { passive: true });
  el.addEventListener('click', function(){ hidePeek(); turn(step); });
}

wireSide(document.getElementById('side-next'), 1);
wireSide(document.getElementById('side-prev'), -1);
window.addEventListener('resize', fitWindow);
boot();
</script>
</body>
</html>
