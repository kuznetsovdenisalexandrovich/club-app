<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Испытание 4 — переходы</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f0f0f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}
  #bar{position:fixed;top:0;left:0;right:0;z-index:20;
    padding-top:max(env(safe-area-inset-top),0px);
    background:rgba(248,246,246,.94);border-bottom:1px solid rgba(0,0,0,.08)}
  #barin{display:flex;align-items:center;gap:6px;padding:7px 10px}
  .seg{display:flex;gap:4px;flex:1}
  .seg button{flex:1;appearance:none;-webkit-appearance:none;border:1px solid #ccc;
    background:#fff;border-radius:8px;padding:7px 4px;font:inherit;font-size:11px;cursor:pointer}
  .seg button.on{background:#111;color:#fff;border-color:#111}
  #pos{font-size:11px;color:#666;padding:0 6px;white-space:nowrap}

  #win{position:fixed;left:0;right:0;bottom:0;overflow:hidden;background:#f0f0f0}
  #f{border:0;display:block;transform-origin:top left;background:#f0f0f0;position:relative;z-index:2}

  /* Полоса, проступающая под страницей при дотягивании */
  #peek{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:4px;
    height:120px;color:#666;font-size:12px;letter-spacing:.02em;text-align:center;padding:0 24px}
  #peek b{font-size:13.5px;color:#111;font-weight:600}

  /* 1. Разделитель-заставка */
  #splash{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:0 32px;text-align:center;
    background:linear-gradient(180deg,#faf8f7 0%,#efe9e6 100%);
    transform:translateY(100%);transition:transform .42s cubic-bezier(.22,.61,.36,1)}
  #splash.show{display:flex;transform:translateY(0)}
  #splash .kicker{font-size:11px;letter-spacing:.18em;color:#8a8178;text-transform:uppercase}
  #splash .title{font-size:24px;line-height:1.25;color:#14110f}
  #splash .go{margin-top:10px;border:1px solid #14110f;background:transparent;color:#14110f;
    border-radius:30px;padding:11px 24px;font:inherit;font-size:13px}

  /* 3. Тонкая полоса снизу */
  #strip{position:absolute;left:0;right:0;bottom:0;z-index:6;
    padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));
    background:rgba(20,17,15,.9);color:#fff;font-size:12.5px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    transform:translateY(110%);transition:transform .3s ease}
  #strip.show{transform:translateY(0)}
  #strip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div id="bar"><div id="barin">
  <div class="seg">
    <button id="m1" onclick="setMode(1)">Заставка</button>
    <button id="m2" onclick="setMode(2)">Дотягивание</button>
    <button id="m3" onclick="setMode(3)">Полоса</button>
  </div>
  <span id="pos">—</span>
</div></div>

<div id="win">
  <div id="peek"><span>дальше</span><b id="peek-title"></b></div>
  <iframe id="f" src="about:blank" scrolling="yes"></iframe>
  <div id="splash">
    <div class="kicker">Дальше</div>
    <div class="title" id="splash-title"></div>
    <button class="go" onclick="go(1)">Читать</button>
  </div>
  <div id="strip"><span id="strip-title"></span><span style="opacity:.7">дальше →</span></div>
</div>

<script>
/* Три способа перейти к следующей части — на одном и том же движке.

   Общее для всех: следующая часть подгружается в кэш браузера, когда человек
   дочитал текущую примерно до 80%. В памяти при этом живёт по-прежнему одна
   часть — прогревается только сеть, поэтому переход получается мгновенным. */

const CANVAS = 1280;
let parts = [], idx = 0, mode = 1;
let atBottom = false, preloaded = -1, busy = false;

async function boot(){
  try {
    const d = await fetch('pilot/parts.json?v=' + Date.now()).then(r => r.json());
    parts = d.parts || [];
  } catch(e){}
  if (!parts.length){ document.getElementById('pos').textContent = 'нет частей'; return; }
  setMode(1);
}

function setMode(m){
  mode = m;
  for (let i = 1; i <= 3; i++)
    document.getElementById('m' + i).className = (i === m ? 'on' : '');
  hideAll();
  if (!document.getElementById('f').src.match(/p\d+\.html/)) open_(0);
}

function nextTitle(){
  return (idx + 1 < parts.length) ? parts[idx + 1].title : '';
}

function hideAll(){
  document.getElementById('splash').classList.remove('show');
  document.getElementById('strip').classList.remove('show');
  document.getElementById('f').style.transform = baseTransform();
}

function baseTransform(){
  const w = document.getElementById('win').clientWidth;
  return 'scale(' + (w / CANVAS) + ')';
}

function fitWindow(){
  document.getElementById('win').style.top = document.getElementById('bar').offsetHeight + 'px';
}

function open_(i){
  if (busy) return;
  busy = true;
  idx = Math.max(0, Math.min(parts.length - 1, i));
  atBottom = false; preloaded = -1;
  document.getElementById('pos').textContent = (idx + 1) + '/' + parts.length;
  document.getElementById('peek-title').textContent = nextTitle();
  document.getElementById('splash-title').textContent = nextTitle();
  document.getElementById('strip-title').textContent = nextTitle();
  hideAll();

  const f = document.getElementById('f');
  f.onload = onLoaded;
  f.src = 'pilot/' + parts[idx].file;
}

function go(step){
  const target = idx + step;
  if (target < 0 || target >= parts.length) return;
  open_(target);
}

function onLoaded(){
  busy = false;
  fitWindow();
  const f = document.getElementById('f');
  const win = document.getElementById('win');
  const w = win.clientWidth, h = win.clientHeight;
  const scale = w / CANVAS;

  f.style.width = CANVAS + 'px';
  f.style.height = Math.ceil(h / scale) + 'px';
  f.style.transform = 'scale(' + scale + ')';

  let d;
  try { d = f.contentDocument; } catch(e){ return; }

  const st = d.createElement('style');
  // Внутри выпуска есть элемент шире холста — из-за него сбоку лезла полоса фона
  st.textContent = 'html,body{overflow-x:hidden!important}';
  d.head.appendChild(st);
  d.defaultView.scrollTo(0, 0);

  const dw = d.defaultView;
  dw.addEventListener('scroll', function(){
    const total = d.body.scrollHeight;
    const seen = dw.scrollY + dw.innerHeight;

    // Прогреваем следующую часть заранее — к моменту перехода она уже в кэше
    if (seen > total * 0.8 && preloaded !== idx && idx + 1 < parts.length){
      preloaded = idx;
      fetch('pilot/' + parts[idx + 1].file).catch(function(){});
    }

    atBottom = seen >= total - 60;
    if (idx + 1 >= parts.length) return;

    if (mode === 1) document.getElementById('splash').classList.toggle('show', atBottom);
    if (mode === 3) document.getElementById('strip').classList.toggle('show', atBottom);
  }, { passive: true });

  if (mode === 2) wirePull(d, dw, scale);
}

/* Дотягивание: у самого низа страница поддаётся пальцу, под ней проступает
   название следующей главы. Отпустил за порогом — часть меняется. */
function wirePull(d, dw, scale){
  const f = document.getElementById('f');
  let startY = 0, pull = 0, active = false;

  d.addEventListener('touchstart', function(e){
    active = atBottom && idx + 1 < parts.length;
    startY = e.touches[0].clientY;
    pull = 0;
  }, { passive: true });

  d.addEventListener('touchmove', function(e){
    if (!active || !atBottom) return;
    const dy = startY - e.touches[0].clientY;     // тянем вверх — dy растёт
    if (dy <= 0){ pull = 0; f.style.transform = baseTransform(); return; }
    pull = Math.min(140, dy * 0.55);              // упругое сопротивление
    f.style.transform = 'translateY(' + (-pull) + 'px) ' + baseTransform();
  }, { passive: true });

  d.addEventListener('touchend', function(){
    if (!active) return;
    const fire = pull > 70;
    f.style.transition = 'transform .28s ease';
    f.style.transform = baseTransform();
    setTimeout(function(){ f.style.transition = ''; if (fire) go(1); }, fire ? 120 : 280);
    active = false; pull = 0;
  }, { passive: true });
}

document.getElementById('strip').addEventListener('click', function(){ go(1); });
window.addEventListener('resize', fitWindow);
boot();
</script>
</body>
</html>
