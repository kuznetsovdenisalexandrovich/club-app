<title>Голо-лаборатория карточек</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- FILE_VERSION: holo-lab-v5 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Раскладка: карточка — главное, крупно по центру. Пульт спрятан в меню:
   на компьютере выезжает справа, на телефоне — шторкой снизу, карточка
   остаётся видна над ней. Тёплый тёмный мир клуба, медный акцент. */
:root{
  --bg:#141010;
  --panel:#1d1716;
  --panel-2:#251d1b;
  --line:#3a2d29;
  --fg:#f2e9e4;
  --muted:#a8978f;
  --accent:#f08a4b;
  --accent-soft:rgba(240,138,75,.16);
  --scrim:rgba(10,7,6,.0);
  --font-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --drawer-w:400px;
  --sheet-h:45vh;
  color-scheme:dark;
}
@supports (height:100dvh){:root{--sheet-h:45dvh}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);height:100%}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;overflow-x:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0}

/* ── верхняя строка ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px;min-height:60px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(17px,3.4vw,24px);letter-spacing:.01em;margin:0;text-wrap:balance}
.burger{appearance:none;flex-shrink:0;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-content:center;gap:5px;cursor:pointer;color:var(--fg);position:relative;z-index:30}
.burger span{display:block;width:20px;height:2px;border-radius:2px;background:currentColor;transition:transform .25s ease, opacity .2s ease}
body.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
body.open .burger span:nth-child(2){opacity:0}
body.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.burger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── сцена: карточка по высоте свободного места ── */
.stage{--free-h:calc(100vh - 60px - 150px);display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px 24px;transition:padding .3s ease}
@supports (height:100dvh){.stage{--free-h:calc(100dvh - 60px - 150px)}}
.scene{perspective:1000px;max-width:100%;
  width:min(560px, 100%, calc(var(--free-h) * 63 / 88))}
@media (min-width:821px){
  body.open .stage{padding-right:calc(var(--drawer-w) + 8px)}
}
@media (max-width:820px){
  body.open .stage{--free-h:calc(100vh - var(--sheet-h) - 60px - 28px)}
  @supports (height:100dvh){ body.open .stage{--free-h:calc(100dvh - var(--sheet-h) - 60px - 28px)} }
  body.open .readout, body.open .src-row, body.open #gyroNote{display:none}
}
.card{position:relative;aspect-ratio:63/88;width:100%;max-width:100%;border-radius:4.5%/3.2%;overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform;background:#000}
.card:active{cursor:grabbing}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
/* Внешний слой — «где ловится свет» (пятна или полоса, бегут с наклоном),
   внутренний — сам узор. Маски вложенных слоёв перемножаются */
.light{position:absolute;inset:0;pointer-events:none;mix-blend-mode:var(--blend,color-dodge);opacity:var(--intensity,.6);
  -webkit-mask-repeat:repeat;mask-repeat:repeat}
.holo{position:absolute;inset:-35%;transform:rotate(var(--angle,45deg));
  background-image:linear-gradient(90deg,
    hsl(0 100% 62%) 0%, hsl(40 100% 60%) 8%, hsl(80 100% 58%) 16%, hsl(150 100% 58%) 24%,
    hsl(195 100% 60%) 32%, hsl(240 100% 66%) 40%, hsl(290 100% 64%) 48%, hsl(340 100% 62%) 56%,
    hsl(20 100% 60%) 64%, hsl(70 100% 58%) 72%, hsl(140 100% 58%) 80%, hsl(200 100% 60%) 88%, hsl(260 100% 66%) 96%, hsl(300 100% 64%) 100%);
  background-size:300% 100%;
  background-position:calc(50% + var(--tx,0) * var(--shift,40%)) 50%;
  filter:saturate(var(--sat,1));
  -webkit-mask-repeat:repeat;mask-repeat:repeat}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,40%), rgba(255,255,255,var(--glare,.5)) 0%, rgba(255,255,255,calc(var(--glare,.5) * .35)) 22%, rgba(255,255,255,0) 55%)}
.readout{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);font-variant-numeric:tabular-nums}
.pill b{color:var(--fg);font-weight:500}
.src-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.note{color:var(--muted);font-size:13px;margin:0;text-align:center;max-width:46ch}

/* ── пульт: выезжающая панель ── */
.drawer{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;
  transition:transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s;visibility:hidden}
body.open .drawer{visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
@media (min-width:821px){
  .drawer{top:0;right:0;bottom:0;width:var(--drawer-w);border-width:0 0 0 1px;transform:translateX(100%);
    padding-top:calc(76px + env(safe-area-inset-top, 0px));padding-right:env(safe-area-inset-right, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
  body.open .drawer{transform:none}
}
@media (max-width:820px){
  .drawer{left:0;right:0;bottom:0;height:var(--sheet-h);border-radius:20px 20px 0 0;border-width:1px 0 0;transform:translateY(100%);
    padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
  body.open .drawer{transform:none}
  .drawer::before{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0;flex-shrink:0}
}
.drawer-scroll{overflow-y:auto;overscroll-behavior:contain;padding:14px 18px 28px;display:flex;flex-direction:column;gap:20px;min-height:0;flex:1}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.patterns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pat,.seg button{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.pat{padding:7px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;line-height:1.2;text-align:center}
.pat canvas{width:40px;height:40px;border-radius:8px;display:block}
.pat[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{padding:9px 6px;font-size:13px}
.pat:focus-visible,.seg button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.row label{font-weight:600;font-size:14px}
.row output{font-family:var(--font-mono);font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:2px 0 0}
.row .hint,.ghint{grid-column:1/-1;color:var(--muted);font-size:12.5px;line-height:1.4;margin:0}
select{width:100%;grid-column:1/-1;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0f0a}
.btn[disabled]{opacity:.7;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:150px;resize:vertical;background:#0f0c0b;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:var(--font-mono);font-size:12px;line-height:1.5}
.toast{min-height:1.4em;font-size:13px;color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.drawer,.burger span,.stage{transition:none}}
</style>

<header class="topbar">
  <h1>Голо-лаборатория</h1>
  <button class="burger" id="burger" type="button" aria-controls="drawer" aria-expanded="false" aria-label="Настройки">
    <span></span><span></span><span></span>
  </button>
</header>

<main class="stage" aria-label="Карточка">
  <div class="scene">
    <div class="card" id="card">
      <img id="art" alt="Образец карточки">
    </div>
  </div>
  <div class="readout">
    <span class="pill">Ввод: <b id="src">мышь / палец</b></span>
    <span class="pill">Кадров/с: <b id="fps">покой</b></span>
  </div>
  <div class="src-row">
    <button class="btn primary" id="gyroBtn" type="button">Включить наклон телефона</button>
    <button class="btn" id="calBtn" type="button" hidden>Обнулить положение</button>
    <label class="btn" for="upload">Своя картинка</label>
    <input class="sr" id="upload" type="file" accept="image/*">
  </div>
  <p class="note" id="gyroNote" hidden></p>
</main>

<aside class="drawer" id="drawer" aria-label="Настройки перелива">
  <div class="drawer-scroll">
    <div class="group">
      <h2>Узор</h2>
      <div class="patterns" id="patterns"></div>
    </div>
    <div class="group" id="sliders"></div>
    <div class="group">
      <h2>Готовые настройки</h2>
      <textarea id="json" aria-label="Настройки текстом" spellcheck="false"></textarea>
      <p class="ghint">Этот же текст вставляется в конструктор перелива серии в дашборде. Сюда можно вставить присланные настройки и нажать «Применить».</p>
      <div class="btn-row">
        <button class="btn primary" id="copyBtn" type="button">Скопировать</button>
        <button class="btn" id="applyBtn" type="button">Применить</button>
        <button class="btn" id="resetBtn" type="button">Сбросить всё</button>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
</aside>

<script>
/* ═══ HoloFX · голографический перелив поверх карточки ══════════════════════
   ОДИН И ТОТ ЖЕ КОД в трёх местах: песочница holo-lab, дашборд (конструктор
   перелива серии), приложение (открытая карточка). Правишь здесь — копируешь
   во все три, иначе дашборд покажет одно, а участник увидит другое.

   Устройство: внутрь карточки кладётся слой .hfx. В нём «полоса света»
   (.hfx-light) — маска, которая бежит по карточке навстречу наклону и на
   крайних углах уходит за край; внутри неё узор (.hfx-pat) — радуга, видимая
   только сквозь плитку узора. Сверху мягкий блик. Плитки узора и маска
   рисуются ОДИН РАЗ при смене настроек; на каждом кадре меняются только
   CSS-переменные и положение маски. Нет движения — нет кадров. */
(function(root){
  "use strict";
  if (root.HoloFX) return;

  var CSS = ''
    + '.hfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}'
    + '.hfx-light{position:absolute;inset:0;mix-blend-mode:var(--hfx-blend,color-dodge);opacity:var(--hfx-intensity,.5);'
    +   '-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}'
    + '.hfx-pat{position:absolute;inset:-35%;transform:rotate(var(--hfx-angle,45deg));'
    +   'background-image:linear-gradient(90deg,hsl(0 100% 62%) 0%,hsl(40 100% 60%) 8%,hsl(80 100% 58%) 16%,hsl(150 100% 58%) 24%,'
    +   'hsl(195 100% 60%) 32%,hsl(240 100% 66%) 40%,hsl(290 100% 64%) 48%,hsl(340 100% 62%) 56%,hsl(20 100% 60%) 64%,'
    +   'hsl(70 100% 58%) 72%,hsl(140 100% 58%) 80%,hsl(200 100% 60%) 88%,hsl(260 100% 66%) 96%,hsl(300 100% 64%) 100%);'
    +   'background-size:300% 100%;background-position:calc(50% + var(--hfx-x,0) * var(--hfx-shift,45%)) 50%;'
    +   'filter:saturate(var(--hfx-sat,1));-webkit-mask-repeat:repeat;mask-repeat:repeat}'
    + '.hfx-glare{position:absolute;inset:0;mix-blend-mode:overlay;background:radial-gradient(circle at var(--hfx-gx,50%) var(--hfx-gy,40%),'
    +   'rgba(255,255,255,var(--hfx-glare,.45)) 0%,rgba(255,255,255,calc(var(--hfx-glare,.45) * .35)) 22%,rgba(255,255,255,0) 55%)}';

  function injectCss(){
    if (document.getElementById('hfx-style')) return;
    var st = document.createElement('style'); st.id = 'hfx-style'; st.textContent = CSS;
    (document.head || document.documentElement).appendChild(st);
  }

  /* Библиотека узоров: у каждого своя геометрия по умолчанию */
  var PATTERNS = [
    {id:"foil",     name:"Гладкая",        def:{scale:20, density:0.5,  angle:110}},
    {id:"lines",    name:"Диагональ",      def:{scale:8,  density:0.45, angle:45}},
    {id:"hatch",    name:"Сетка",          def:{scale:10, density:0.35, angle:45}},
    {id:"waves",    name:"Волны",          def:{scale:12, density:0.35, angle:0}},
    {id:"zigzag",   name:"Зигзаг",         def:{scale:12, density:0.3,  angle:0}},
    {id:"squares",  name:"Квадраты",       def:{scale:14, density:0.6,  angle:45}},
    {id:"checker",  name:"Шахматка",       def:{scale:10, density:0.9,  angle:0}},
    {id:"triangles",name:"Треугольники",   def:{scale:14, density:0.6,  angle:0}},
    {id:"hex",      name:"Соты",           def:{scale:9,  density:0.35, angle:0}},
    {id:"scales",   name:"Чешуя",          def:{scale:14, density:0.35, angle:0}},
    {id:"dots",     name:"Точки",          def:{scale:10, density:0.55, angle:30}},
    {id:"dots2",    name:"Точки вразбег",  def:{scale:9,  density:0.6,  angle:0}},
    {id:"circles",  name:"Колечки",        def:{scale:12, density:0.35, angle:0}},
    {id:"circles2", name:"Колечки вразбег",def:{scale:10, density:0.35, angle:0}},
    {id:"rings",    name:"Круги",          def:{scale:10, density:0.45, angle:0}},
    {id:"sunburst", name:"Лучи",           def:{scale:12, density:0.5,  angle:0}},
    {id:"stars",    name:"Звёздочки",      def:{scale:14, density:0.6,  angle:0}},
    {id:"hearts",   name:"Сердечки",       def:{scale:16, density:0.6,  angle:0}},
    {id:"dollars",  name:"Доллары",        def:{scale:18, density:0.6,  angle:0}},
    {id:"bolts",    name:"Молнии",         def:{scale:18, density:0.6,  angle:15}},
    {id:"sparks",   name:"Искры",          def:{scale:10, density:0.35, angle:0}},
    {id:"glitter",  name:"Блёстки",        def:{scale:9,  density:0.35, angle:0}}
  ];
  var BY_ID = {}; PATTERNS.forEach(function(p){ BY_ID[p.id] = p; });

  /* Умолчания всего набора. Ключ → [по умолчанию, мин, макс] */
  var RANGES = {
    scale:[8,3,60], density:[0.45,0.05,0.95], angle:[45,0,180],
    intensity:[0.5,0,1], glare:[0.45,0,1], sat:[1.1,0,2], shift:[45,5,100],
    band:[16,4,45], bandAngle:[115,0,180], bandRest:[1,-1.5,1.5], soft:[0.18,0.02,0.5], travel:[1.2,0.2,3],
    range:[18,4,45], smooth:[0.18,0.03,1], tilt:[8,0,20]
  };
  var BLENDS = ["color-dodge","overlay","screen","soft-light","hard-light"];

  function defaults(patternId){
    var out = {pattern: BY_ID[patternId] ? patternId : "lines", blend:"color-dodge"};
    Object.keys(RANGES).forEach(function(k){ out[k] = RANGES[k][0]; });
    var d = BY_ID[out.pattern].def; out.scale = d.scale; out.density = d.density; out.angle = d.angle;
    return out;
  }
  /* Чистка набора: неизвестное выбрасываем, числа зажимаем в границы.
     Тот же разбор делает сервер — набор из дашборда и из песочницы один */
  function normalize(s){
    s = s || {};
    var out = defaults(BY_ID[s.pattern] ? s.pattern : "lines");
    Object.keys(RANGES).forEach(function(k){
      var v = Number(s[k]); if (!isFinite(v)) return;
      out[k] = Math.min(RANGES[k][2], Math.max(RANGES[k][1], v));
    });
    if (BLENDS.indexOf(s.blend) >= 0) out.blend = s.blend;
    return out;
  }

  function rndGen(seed){ return function(){ seed = (seed*16807) % 2147483647; return seed/2147483647; }; }

  /* Плитка узора. Чёрное = узор виден, прозрачное = нет */
  function tileCanvas(p, S0, d, dpr){
    var w = S0, h = S0, r3 = Math.sqrt(3);
    if (p === "waves" || p === "zigzag") { w = S0*2; h = S0; }
    if (p === "checker" || p === "dots2" || p === "circles2") { w = h = S0*2; }
    if (p === "triangles") { w = S0; h = S0*r3; }
    if (p === "hex") { w = S0*r3; h = S0*3; }
    if (p === "glitter" || p === "sparks") { w = h = 220; }
    var c = document.createElement("canvas");
    c.width = Math.max(2, Math.round(w*dpr)); c.height = Math.max(2, Math.round(h*dpr));
    var g = c.getContext("2d"); g.scale(dpr,dpr); g.fillStyle = "#000"; g.strokeStyle = "#000";
    var lw = function(k){ g.lineWidth = Math.max(.6, S0*d*k); };
    var size = S0*(.3+.6*d);   // размер значка для фигурных узоров
    if (p === "lines")   g.fillRect(0,0,Math.max(.5,w*d),h);
    if (p === "hatch")   { var t = Math.max(.5,S0*d/2); g.fillRect(0,0,t,h); g.fillRect(0,0,w,t); }
    if (p === "waves")   { lw(.6); g.beginPath(); for (var x=-1;x<=w+1;x+=1){ var y = h/2 + h*.28*Math.sin(x/w*Math.PI*2); if (x<0) g.moveTo(x,y); else g.lineTo(x,y); } g.stroke(); }
    if (p === "zigzag")  { lw(.6); g.lineJoin = "miter"; g.beginPath(); g.moveTo(-w/4,h*.8); g.lineTo(0,h*.2); g.lineTo(w/2,h*.8); g.lineTo(w,h*.2); g.lineTo(w*1.25,h*.8); g.stroke(); }
    if (p === "squares") { var s1 = S0*d; g.fillRect((w-s1)/2,(h-s1)/2,s1,s1); }
    if (p === "checker") { var s2 = S0*(.3+.7*d); g.fillRect((S0-s2)/2,(S0-s2)/2,s2,s2); g.fillRect(S0+(S0-s2)/2,S0+(S0-s2)/2,s2,s2); }
    if (p === "triangles") {
      var side = S0*(.3+.7*d), th = side*r3/2;
      [[w/2, h/4],[0, h*3/4],[w, h*3/4]].forEach(function(q){
        g.beginPath(); g.moveTo(q[0], q[1]-th/2); g.lineTo(q[0]+side/2, q[1]+th/2); g.lineTo(q[0]-side/2, q[1]+th/2); g.closePath(); g.fill(); });
    }
    if (p === "hex") {
      lw(.5); var R = S0;
      [[0,0],[w,0],[w/2,1.5*R],[0,3*R],[w,3*R]].forEach(function(q){ g.beginPath();

  var pbox = $("patterns");
  HoloFX.PATTERNS.forEach(function(p){
    var b = document.createElement("button"); b.type = "button"; b.className = "pat"; b.dataset.p = p.id;
    var c = document.createElement("canvas"); c.width = 88; c.height = 88; b.appendChild(c);
    var t = document.createElement("span"); t.textContent = p.name; b.appendChild(t);
    b.addEventListener("click", function(){ S.pattern = p.id; S.scale = p.def.scale; S.density = p.def.density; S.angle = p.def.angle; apply(); });
    pbox.appendChild(b); HoloFX.thumb(c, p.id);
  });

  $("resetBtn").addEventListener("click", function(){ S = HoloFX.defaults(S.pattern); apply(); });
  $("applyBtn").addEventListener("click", function(){
    var toast = $("toast"), v;
    try { v = JSON.parse($("json").value); } catch(e) { toast.textContent = "Текст не похож на настройки — проверь, что скопирован целиком"; return; }
    S = HoloFX.normalize(v); apply();
    toast.textContent = "Применено"; setTimeout(function(){ toast.textContent = ""; }, 2500);
  });
  $("copyBtn").addEventListener("click", function(){
    var ta = $("json"), toast = $("toast");
    function fallback(){ ta.focus(); ta.select(); toast.textContent = "Текст выделен — скопируй вручную"; }
    try { navigator.clipboard.writeText(ta.value).then(function(){ toast.textContent = "Скопировано"; }, fallback); }
    catch(e) { fallback(); }
    setTimeout(function(){ toast.textContent = ""; }, 2500);
  });

  /* ── меню ── */
  function setOpen(v){
    document.body.classList.toggle("open", v);
    $("burger").setAttribute("aria-expanded", v ? "true" : "false");
    try { localStorage.setItem(KEY + "-open", v ? "1" : "0"); } catch(e) {}
  }
  $("burger").addEventListener("click", function(){ setOpen(!document.body.classList.contains("open")); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") setOpen(false); });
  try { if (localStorage.getItem(KEY + "-open") === "1") setOpen(true); } catch(e) {}

  /* ── наклон ── */
  function note(t){ var n = $("gyroNote"); n.textContent = t; n.hidden = !t; }
  var WHY = {
    tg_denied: "Telegram не дал доступ к гироскопу.",
    no_sensor: "Это устройство не сообщает наклон. Веди пальцем по карточке.",
    silent: "Наклон не приходит: здесь его не пускают. Открой страницу в Safari или Chrome на телефоне, а пока веди пальцем по карточке.",
    denied: "Доступ к наклону не дан. Его можно разрешить в настройках Safari для этого сайта."
  };
  $("gyroBtn").addEventListener("click", function(){
    fx.startGyro(true, function(ok, why){
      if (!ok) { note(WHY[why] || "Наклон недоступен."); return; }
      note(""); $("src").textContent = why === "tg" ? "гироскоп Telegram" : "гироскоп";
      $("calBtn").hidden = false; $("gyroBtn").textContent = "Наклон включён"; $("gyroBtn").disabled = true;
    });
  });
  $("calBtn").addEventListener("click", function(){ fx.recenter(); });

  /* ── образец карточки (своя картинка заменяет) ── */
  function sampleArt(){
    var c = document.createElement("canvas"); c.width = 630; c.height = 880;
    var g = c.getContext("2d");
    var bg = g.createRadialGradient(315,360,40,315,440,620);
    bg.addColorStop(0,"#7a3a1c"); bg.addColorStop(.45,"#3a1a10"); bg.addColorStop(1,"#0e0806");
    g.fillStyle = bg; g.fillRect(0,0,630,880);
    g.save(); g.translate(315,360);
    for (var i=0;i<36;i++){ g.rotate(Math.PI/18); g.fillStyle = i%2 ? "rgba(255,190,120,.05)" : "rgba(255,190,120,.10)";
      g.beginPath(); g.moveTo(0,0); g.lineTo(-40,-700); g.lineTo(40,-700); g.closePath(); g.fill(); }
    g.restore();
    g.lineWidth = 3; g.strokeStyle = "rgba(255,206,150,.85)";
    g.beginPath(); g.arc(315,360,150,0,Math.PI*2); g.stroke();
    g.lineWidth = 1.5; g.beginPath(); g.arc(315,360,170,0,Math.PI*2); g.stroke();
    function meander(y){ g.save(); g.strokeStyle="rgba(255,206,150,.7)"; g.lineWidth=3; g.beginPath();
      for (var x=40;x<590;x+=30){ g.moveTo(x,y+18); g.lineTo(x,y); g.lineTo(x+22,y); g.lineTo(x+22,y+12); g.lineTo(x+10,y+12); g.lineTo(x+10,y+6); }
      g.stroke(); g.restore(); }
    meander(570); meander(820);
    g.fillStyle = "#f6dcc0"; g.textAlign = "center";
    g.font = "700 30px Unbounded, Arial Black, sans-serif"; g.fillText("ПАНТЕОН", 315, 92);
    g.font = "500 16px Manrope, sans-serif"; g.fillStyle = "rgba(246,220,192,.7)"; g.fillText("ОБРАЗЕЦ КАРТОЧКИ", 315, 124);
    g.font = "700 120px Unbounded, Arial Black, sans-serif"; g.fillStyle = "#ffd9b0"; g.fillText("Б", 315, 405);
    g.font = "700 44px Unbounded, Arial Black, sans-serif"; g.fillStyle = "#f6dcc0"; g.fillText("БОЖЕНЬКА", 315, 680);
    g.font = "500 22px Manrope, sans-serif"; g.fillStyle = "rgba(246,220,192,.75)"; g.fillText("Легендарная · 07 / 16", 315, 730);
    g.lineWidth = 10; g.strokeStyle = "#c98a52"; g.strokeRect(14,14,602,852);
    g.lineWidth = 2; g.strokeStyle = "rgba(255,220,180,.6)"; g.strokeRect(30,30,570,820);
    return c.toDataURL("image/jpeg", .9);
  }
  var ownArt = false;
  function drawSample(){ if (!ownArt) $("art").src = sampleArt(); }
  drawSample();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawSample);
  $("upload").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function(){ ownArt = true; $("art").src = r.result; }; r.readAsDataURL(f);
  });

  // Telegram-скрипт: подключаем, только если страница открыта в Telegram
  if (/tgWebApp/i.test(location.hash) || /Telegram/i.test(navigator.userAgent)) {
    var sc = document.createElement("script"); sc.src = "https://telegram.org/js/telegram-web-app.js";
    sc.onload = function(){ try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(_){} };
    document.head.appendChild(sc);
  }

  sync();
})();
</script>
